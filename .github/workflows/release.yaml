name: Release

on:
  push:
    tags:
      - v[0-9]+\.[0-9]+\.[0-9]+
      - v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: cd ui && npm ci && npm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Create GitHub App Token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.JDEL_CROSS_REPO_PUSHER_APP_ID }}
          private-key: ${{ secrets.JDEL_CROSS_REPO_PUSHER_PRIVATE_KEY }}
          owner: "jdel"
          repositories: "homebrew-tap"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64, arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: amd64, arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}

  # goreleaser builds the Go CLI; it cannot build Tauri apps. This job runs on
  # native runners per OS, bundles the host-arch emission binary into a Tauri
  # desktop installer, and uploads each to the draft release goreleaser created
  # above.
  tauri:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: tauri/target/release/bundle/macos/*.zip
          - os: windows-latest
            bundles: nsis
            artifact: tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-latest
            bundles: appimage,deb,rpm
            artifact: tauri/target/release/bundle/appimage/*.AppImage tauri/target/release/bundle/deb/*.deb tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libfuse2 patchelf build-essential

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Set app version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v' tauri/tauri.conf.json > "$tmp"
          mv "$tmp" tauri/tauri.conf.json

      - name: Stage binary, UI and icons
        shell: bash
        run: make tauri-bin tauri-icon

      - name: Build desktop app
        shell: bash
        run: cd tauri && tauri build --bundles ${{ matrix.bundles }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd tauri/target/release/bundle/macos
          ditto -c -k --keepParent *.app "Emission_${GITHUB_REF_NAME#v}_macos.zip"

      - name: Upload installer to release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tap token
        id: tap-token
        if: runner.os == 'macOS'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.JDEL_CROSS_REPO_PUSHER_APP_ID }}
          private-key: ${{ secrets.JDEL_CROSS_REPO_PUSHER_PRIVATE_KEY }}
          owner: "jdel"
          repositories: "homebrew-tap"

      - name: Publish emission-desktop cask
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="tauri/target/release/bundle/macos/Emission_${version}_macos.zip"
          sha=$(shasum -a 256 "$zip" | awk '{print $1}')
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/jdel/homebrew-tap.git" tap
          sed -e "s/{{VERSION}}/${version}/g" -e "s/{{SHA256}}/${sha}/g" \
              .emission-desktop.rb.tmpl > tap/Casks/emission-desktop.rb
          cd tap
          git config user.name "emission[bot]"
          git config user.email "noreply@jdel.org"
          git add Casks/emission-desktop.rb
          git diff --cached --quiet || git commit -m "emission-desktop ${version}"
          git push
