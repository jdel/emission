name: Release

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: emission
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: cd ui && npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ${{ env.BINARY_NAME }}${{ matrix.goos == 'windows' && '.exe' || '' }} \
            .

      # Asset filenames intentionally exclude the version so the GitHub
      # "latest/download/<filename>" redirect resolves to a stable URL.
      # The release itself is versioned; the assets inside don't need to be.
      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: |
          ARCH=${{ matrix.goarch }}${{ matrix.goarm && 'v' || '' }}${{ matrix.goarm }}
          ARCHIVE=${{ env.BINARY_NAME }}-${{ matrix.goos }}-${ARCH}.tar.gz
          tar czvf "${ARCHIVE}" ${{ env.BINARY_NAME }}
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: |
          ARCHIVE=${{ env.BINARY_NAME }}-windows-amd64.zip
          zip "${ARCHIVE}" ${{ env.BINARY_NAME }}.exe
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
