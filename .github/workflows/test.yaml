name: Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate Swagger docs
        run: go generate ./...

      - name: Verify generated docs are committed
        run: git diff --exit-code -- internal/docs

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test
        run: go test -v -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Type check
        run: cd ui && npx tsc -b --noEmit

      - name: Lint
        run: cd ui && npm run lint

      - name: Test
        run: cd ui && npm test

      - name: Build
        run: cd ui && npm run build
